name: Daily market snapshot (v2)

on:
  schedule:
    - cron: "5 4 * * *"    # 04:05 UTC = 07:05 Kyiv
    - cron: "35 4 * * *"   # 04:35 UTC = 07:35 Kyiv — backup in case GitHub delays or drops the first run; the morning brief runs at 07:52
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/tests.py
      - run: python scripts/fetch.py
      - name: Commit data
        run: |
          git config user.name "market-snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "snapshot $(date -u +%Y-%m-%d)"
          git push
